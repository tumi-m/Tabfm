name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Lint
        run: python -m ruff check src tests

      # The suite is deliberately offline — no dataset downloads, no model
      # weights — so it stays fast and cannot fail on someone else's outage.
      - name: Test
        run: python -m pytest -q

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    # Skip for pull requests from forks, which have no package write access.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names, and repository names are not
      # guaranteed lowercase.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tabfm-lab-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # BAKE_ARTIFACTS trains during the build, so the published image starts
      # serving immediately instead of training on first boot. It needs network
      # at build time to fetch the public datasets, which runners have.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BAKE_ARTIFACTS=true
            INSTALL_TABFM=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          IMAGE=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          # Baked artifacts mean no training on boot, but imports and
          # unpickling still take a little time.
          curl -sS --retry 30 --retry-delay 2 --retry-connrefused \
               --fail http://127.0.0.1:8000/api/ready
          curl -sS --fail http://127.0.0.1:8000/ > /dev/null
          curl -sS --fail -X POST http://127.0.0.1:8000/api/models/ecommerce-conversion/predict \
               -H 'Content-Type: application/json' \
               -d '{"records":[{"PageValues":42}]}'
          docker rm -f smoke
