[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabfm-lab"
version = "0.1.0"
description = "Zero-shot classification and regression benchmarks for Google TabFM on e-commerce and sports-betting data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tumi-m" }]
keywords = ["tabfm", "tabular", "foundation-model", "ecommerce", "sports-betting"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
# The TabFM foundation model itself. Torch backend runs on CPU or GPU.
tabfm = ["tabfm[pytorch]>=1.0.1"]
# JAX backend alternative.
tabfm-jax = ["tabfm[jax]>=1.0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
tabfm-lab = "tabfm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
