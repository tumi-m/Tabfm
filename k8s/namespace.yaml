apiVersion: v1
kind: Namespace
metadata:
  name: tabfm-lab
  labels:
    app.kubernetes.io/name: tabfm-lab
    # Pods here run unprivileged as a non-root user with all capabilities
    # dropped, so the strictest built-in policy applies cleanly.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
