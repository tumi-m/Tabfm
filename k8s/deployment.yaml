apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabfm-lab-api
  namespace: tabfm-lab
  labels:
    app.kubernetes.io/name: tabfm-lab
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tabfm-lab
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabfm-lab
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure cannot take the
      # whole service with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tabfm-lab
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/tumi-m/tabfm-lab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tabfm-lab-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"

          # Startup probe covers the unpickling window, so a slow cold start is
          # not mistaken for a hung process. Liveness only begins after it
          # succeeds: up to 60 x 2s = 2 minutes of grace.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60

          # Liveness deliberately hits /api/health, which never touches the
          # models: an artifact problem should fail readiness and drain traffic,
          # not restart-loop the container.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness hits /api/ready, which returns 503 until at least one
          # artifact is loaded — so a pod with an empty volume is kept out of
          # the Service rather than serving 404s.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/tabfm/artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: tabfm-lab-artifacts
            readOnly: true
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tabfm-lab-api
  namespace: tabfm-lab
  labels:
    app.kubernetes.io/name: tabfm-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tabfm-lab
      app.kubernetes.io/component: api
